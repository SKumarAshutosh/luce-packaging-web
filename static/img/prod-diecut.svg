<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Custom die-cut mailer box shown flat and assembled">
  <defs>
    <linearGradient id="dFlat" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#F1E0C2"/><stop offset="1" stop-color="#DCC49C"/>
    </linearGradient>
    <linearGradient id="dTop" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#F4E4C9"/><stop offset="1" stop-color="#E0C89F"/>
    </linearGradient>
    <linearGradient id="dLeft" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#DCC49C"/><stop offset="1" stop-color="#C5A87A"/>
    </linearGradient>
    <linearGradient id="dRight" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#C09E6D"/><stop offset="1" stop-color="#A38350"/>
    </linearGradient>
    <pattern id="dFlute" width="8" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 2.5q2-2.6 4 0t4 0" fill="none" stroke="#87683A" stroke-width="1.1" opacity=".6"/>
    </pattern>
  </defs>

  <ellipse cx="250" cy="318" rx="130" ry="14" fill="#B3966D" opacity=".18"/>

  <!-- ══ flat die-cut blank, laid out behind ══════════════ -->
  <g transform="translate(28 44) rotate(-7)" stroke="#A2823F" stroke-width="1.4" stroke-linejoin="round">
    <!-- outer cut profile of a tuck-top mailer blank -->
    <path d="M18 60 h34 v-26 h58 v26 h34 v58 h-34 v26 h-58 v-26 h-34 Z"
          fill="url(#dFlat)"/>
    <!-- crease (fold) lines — dashed, the way a die drawing shows them -->
    <g fill="none" stroke="#8A6B3C" stroke-width="1.2" stroke-dasharray="5 4" opacity=".8">
      <path d="M52 60v58M110 60v58M52 60h58M52 118h58"/>
    </g>
    <!-- thumb notch -->
    <path d="M74 34a7 7 0 0 0 14 0" fill="none" stroke="#A2823F" stroke-width="1.4"/>
    <!-- flute direction arrows on the blank -->
    <g fill="none" stroke="#B08F5E" stroke-width="1" opacity=".55">
      <path d="M60 72h42M60 80h42M60 88h42M60 96h42M60 104h42"/>
    </g>
  </g>

  <!-- ══ assembled mailer, front ══════════════════════════ -->
  <g stroke="#9B7A4A" stroke-width="1.5" stroke-linejoin="round">
    <!-- body -->
    <path d="M262 176 358 224 262 272 166 224Z" fill="url(#dTop)"/>
    <path d="M166 224 166 274 262 322 262 272Z" fill="url(#dLeft)"/>
    <path d="M358 224 358 274 262 322 262 272Z" fill="url(#dRight)"/>

    <!-- corrugated edge along the open rim -->
    <path d="M166 224 166 231 262 279 262 272Z" fill="url(#dFlute)" stroke="none"/>
    <path d="M358 224 358 231 262 279 262 272Z" fill="url(#dFlute)" stroke="none"/>

    <!-- inner cavity, so it reads as open -->
    <path d="M262 190 344 231 262 272 180 231Z" fill="#C7A87A" stroke="#9B7A4A" stroke-width="1.2"/>
    <path d="M262 196 338 232 262 268 186 232Z" fill="#B99A6C" stroke="none" opacity=".7"/>

    <!-- hinged lid, folded open to the back-left -->
    <path d="M166 224 262 176 214 130 118 178Z" fill="url(#dTop)" opacity=".97"/>
    <path d="M166 224 118 178 118 185 166 231Z" fill="url(#dFlute)" stroke="none"/>
    <!-- thumb notch on the lid edge -->
    <path d="M186 155a9 9 0 0 0 17-8" fill="none" stroke="#9B7A4A" stroke-width="1.3"/>

    <!-- side tuck flap standing up -->
    <path d="M358 224 262 176 262 158 358 206Z" fill="#E8D2AC" opacity=".9"/>

    <!-- brand mark stencilled on the left panel (pre-shear coords) -->
    <g transform="matrix(1,0.5,0,1,0,0)" stroke="none">
      <ellipse cx="200" cy="151" rx="10" ry="11" fill="#D9902A" opacity=".8"/>
    </g>
    <g transform="matrix(1,0.5,0,1,0,0)" fill="none"
       stroke="#C07A18" stroke-width="1.5" stroke-linecap="round" opacity=".75">
      <path d="M200 135v-5M200 167v5M181 151h-5M219 151h5"/>
    </g>
    <!-- shipping label on the right panel (pre-shear coords) -->
    <g transform="matrix(1,-0.5,0,1,0,0)">
      <rect x="284" y="392" width="46" height="30" rx="3"
            fill="#FBF6EC" stroke="#A2823F" stroke-width="1.2"/>
      <g stroke="none" fill="#8A7B63" opacity=".65">
        <rect x="290" y="398" width="34" height="3.5" rx="1.75"/>
        <rect x="290" y="405" width="24" height="3.5" rx="1.75"/>
      </g>
      <!-- barcode -->
      <g stroke="#3B342C" stroke-width="1.4" opacity=".7">
        <path d="M290 412v6M293 412v6M297 412v6M300 412v6M304 412v6M307 412v6M312 412v6M316 412v6M320 412v6"/>
      </g>
    </g>
  </g>

  <!-- "made to spec" dimension callout -->
  <g fill="none" stroke="#1479C4" stroke-width="1.4" opacity=".75" stroke-linecap="round">
    <path d="M374 236 386 242M374 286 386 292M386 242v50"/>
    <path d="M383 248l3-6 3 6M383 286l3 6 3-6" stroke-width="1.2"/>
  </g>
  <text x="394" y="270" font-family="Manrope, sans-serif" font-size="12"
        font-weight="700" fill="#1479C4" opacity=".8">H</text>
</svg>
